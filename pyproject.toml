[project]
name = "ai-help-center-source-tester"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0.2",
    "scikit-learn>=1.6.1",
    "sentence-transformers>=5.1.2",
]

[dependency-groups]
dev = [
    "ruff>=0.15.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retrieval"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
